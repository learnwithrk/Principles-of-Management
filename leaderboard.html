<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard — Principles of Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="topbar"></div>

<main style="margin-top:0;">
  <div class="container" style="padding-top:32px;">
    <a href="index.html" class="btn btn-ghost" style="margin-bottom:18px;">&larr; All quizzes</a>
    <div id="lbRoot"></div>
  </div>
</main>

<footer><div class="container">Principles of Management — Quiz Hub</div></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  QuizApp.renderTopbar();
  const params = new URLSearchParams(location.search);
  const quizId = params.get("id");
  const root = document.getElementById("lbRoot");
  if (!quizId) {
    root.innerHTML = `<div class="empty-note">No quiz selected.</div>`;
    return;
  }

  let title = quizId;
  try {
    const manifest = await (await fetch("quizzes/manifest.json")).json();
    const entry = manifest.find((q) => q.id === quizId);
    if (entry) title = entry.title;
  } catch (e) { /* ignore, fall back to id */ }

  root.innerHTML = `
    <div class="section-head"><h2>Leaderboard — ${QuizApp.escapeHtml(title)}</h2><div class="rule"></div></div>
    <div id="lbNote"></div>
    <div class="leaderboard">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th></tr></thead>
        <tbody id="lbBody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div style="margin-top:22px;">
      <a class="btn btn-primary" href="quiz.html?id=${encodeURIComponent(quizId)}">Take this quiz</a>
    </div>`;

  if (QuizApp.isFallback()) {
    document.getElementById("lbNote").innerHTML = `<div class="banner">Running in local demo mode — scores are only visible in this browser until Firebase is configured in <code>js/firebase-config.js</code>.</div>`;
  }

  try {
    const rows = await QuizApp.fetchLeaderboard(quizId, 50);
    const body = document.getElementById("lbBody");
    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="4" class="empty">No scores recorded yet — be the first to take this quiz.</td></tr>`;
    } else {
      body.innerHTML = rows.map((r, i) => `
        <tr><td class="rank">${i + 1}</td><td>${QuizApp.escapeHtml(r.name)}</td><td>${r.score}/${r.total}</td><td>${r.percent}%</td></tr>
      `).join("");
    }
  } catch (e) {
    document.getElementById("lbBody").innerHTML = `<tr><td colspan="4" class="empty">Couldn't load the leaderboard.</td></tr>`;
  }
})();
</script>
</body>
</html>
