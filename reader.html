<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2d">
<title>Read Presentation — Learn with RK</title>
<link rel="stylesheet" href="reader.css">
</head>
<body>
<header class="reader-header">
  <a class="back" href="index.html">← Home</a>
  <div class="title-wrap"><div class="eyebrow">Learn with RK</div><h1 id="deckTitle">Presentation</h1></div>
  <button id="fullscreenBtn" class="tool-btn" type="button">⛶ Full screen</button>
</header>
<main class="reader">
  <section id="viewer" class="viewer-shell" aria-label="Presentation reader">
    <div id="loading" class="status">Opening presentation…</div>
    <div id="slideStage" class="slide-stage" hidden>
      <button id="prevBtn" class="nav-arrow prev" type="button" aria-label="Previous slide">‹</button>
      <div class="slide-frame"><img id="slideImage" alt="Presentation slide" draggable="false"></div>
      <button id="nextBtn" class="nav-arrow next" type="button" aria-label="Next slide">›</button>
    </div>
    <div class="controls">
      <button id="prevControl" class="control-btn" type="button">Previous</button>
      <div class="counter" id="counter">—</div>
      <button id="nextControl" class="control-btn" type="button">Next</button>
    </div>
  </section>
  <p class="help">Use Previous / Next or swipe left/right on mobile. Press ← / → on a keyboard.</p>
</main>
<script src="reader.js"></script>
</body>
</html>
